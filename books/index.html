<!DOCTYPE html>
<html lang="en">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dookiereads</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #333; }
        nav { display: flex; gap: 1rem; padding: 1rem; }
        nav a { text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<div id="banner"></div>

<script>
  fetch("/banner.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("banner").innerHTML = html;
    });
</script>

<body>
    <main>
        <h1>sometimes i read</h1>
        <p>i like indecipherable fiction and straightforward non-fiction</p>
    </main>
</body>
</html>
